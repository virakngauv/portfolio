version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      compatible-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      compatible-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
