name: Portfolio CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Install development dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality suite
        run: pnpm check
  browser:
    name: Browser (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Install development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Run browser smoke tests
        run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned checkouts
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[-+U]'; then exit 1; fi
      - name: Build server-only runtime
        run: docker build --target runtime -t portfolio-runtime:test .
      - name: Run under the target memory ceiling
        run: |
          docker run -d --name runtime --memory=512m --memory-swap=512m --cpus=1 \
            --env-file .env.example portfolio-runtime:test
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' runtime)" = healthy ]; then exit 0; fi
            if [ "$(docker inspect --format '{{.State.Running}}' runtime)" != true ]; then break; fi
            sleep 2
          done
          docker logs runtime
          exit 1
      - name: Real Socket.IO smoke checks through the gateway
        run: docker run --rm --network container:runtime --env-file .env.example portfolio-runtime:test node scripts/smoke.mjs
      - name: Check memory and graceful container shutdown
        run: |
          docker stats --no-stream runtime
          docker stop --time 15 runtime
          test "$(docker inspect --format '{{.State.ExitCode}}' runtime)" = 0
          test "$(docker inspect --format '{{.State.OOMKilled}}' runtime)" = false
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs runtime || true
          docker rm -f runtime || true

