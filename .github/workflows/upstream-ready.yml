name: Reconcile upstream releases
on:
  workflow_dispatch:
  schedule:
    # Selected once with Python secrets.randbelow(300): 02:20 Pacific.
    - cron: '20 2 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: portfolio-release-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.PORTFOLIO_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.PORTFOLIO_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
          owner: virakngauv
          repositories: portfolio
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Reconcile tested upstream revisions
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PORTFOLIO_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: node scripts/reconcile-upstreams.mjs
